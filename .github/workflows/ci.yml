name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Exercise the full builds that pushes only evaluate.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      build_homes:
        description: Build both Home Manager configurations
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The closure exceeds the 10 GB per-repository cache limit, so trim
          # it on save and keep only the newest entry for this prefix.
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Run flake checks
        run: nix flake check --show-trace --no-update-lock-file

      - name: Evaluate Home Manager configurations
        run: |
          nix eval --no-update-lock-file --raw .#homeConfigurations.schan.activationPackage.drvPath
          printf '\n'
          nix eval --no-update-lock-file --raw .#homeConfigurations.stachan.activationPackage.drvPath
          printf '\n'

      - name: Build Home Manager configurations
        if:
          ${{ github.event_name == 'schedule' || (github.event_name ==
          'workflow_dispatch' && inputs.build_homes) }}
        run: |
          nix build --no-link --print-build-logs \
            --no-update-lock-file \
            .#homeConfigurations.schan.activationPackage \
            .#homeConfigurations.stachan.activationPackage
