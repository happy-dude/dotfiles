patch:
  schema/dependencies:
    - terra_pinyin
    - luna_pinyin
    - loengfan
    - stroke
    - cangjie5

  # Comment-writing filters go before the simplifiers: a simplified or variant
  # candidate is a ShadowCandidate, and setting its comment from Lua is a no-op.
  # The reverse lookup goes first because it skips candidates that already
  # carry a comment.
  engine/filters:
    - reverse_lookup_filter@jyut6ping3_reverse_lookup
    - lua_filter@jyutping_pinyin_filter
    - simplifier@emoji_cantonese_suggestion
    - simplifier@variants_hk
    - simplifier@trad_tw
    - simplifier@simplification
    - uniquifier

  # Override upstream's t2hkf.json (not installed) with t2hk.json
  variants_hk:
    option_name: variants_hk
    opencc_config: t2hk.json
    tips: none

  # Missing upstream — required for Simplified toggle to work
  simplification:
    option_name: simplification
    opencc_config: t2s.json
    tips: none
