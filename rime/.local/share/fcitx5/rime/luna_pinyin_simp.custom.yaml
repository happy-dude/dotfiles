patch:
  # The dictionaries lua/tonal_pinyin.lua looks readings up in, added to
  # whatever the stock schema depends on.
  schema/dependencies/+:
    - terra_pinyin
    - luna_pinyin
    - jyut6ping3

  # The Lua filter goes in front of the stock filters, which start with the
  # simplifiers: a simplified candidate is a ShadowCandidate, and setting its
  # comment from Lua is a no-op. Position 0 is in front of whatever the stock
  # list holds, so rime/stock-schemas.nix has no list to hold for this patch.
  engine/filters/@before 0: lua_filter@tonal_pinyin_filter
