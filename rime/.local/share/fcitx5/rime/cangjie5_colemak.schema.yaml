# Cangjie 5 on a Colemak keyboard: the stock schema, with every key read as
# the QWERTY key at the same position, which is the Cangjie letter printed
# on it.
#
# The patches name list positions, which the stock schema can move.
# rime/stock-schemas.nix holds the lists they were written against, so a lock
# update that changes one fails evaluation instead of a component quietly
# landing in the wrong place.

__include: cangjie5.schema:/

__patch:
  # After recognizer (position 1), which takes the backtick Pinyin lookup
  # before the letters are remapped.
  - engine/processors/@after 1: lua_processor@colemak_remap
  # Before simplifier (position 0): cangjie_display looks up Traditional
  # characters in cangjie5, and setting a comment on a simplified
  # ShadowCandidate is a no-op.
  - engine/filters/@before 0: lua_filter@cangjie_display
  # The Lua comment already shows the Traditional character; the stock value
  # replaces it with 〔傳統漢字〕.
  - simplifier/tips: none
  # Rime adds a schema's own .custom patch only when the schema has no
  # __patch, so name it as the stock schemas that have one do.
  - cangjie5_colemak.custom:/patch?

schema:
  schema_id: cangjie5_colemak
  name: 倉頡五代（Colemak）
  description: |
    第五代倉頡輸入法
    Colemak physical → QWERTY logical mapping
